<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b10" />
    <meta
      name="description"
      content="Tiny Sphere — light and music on the Burning Man Sonic Sphere."
    />
    <title>Tiny Sphere</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="icons/red-outline-circle.svg" />
    <link rel="stylesheet" href="./ui/style.css" />
    <link rel="stylesheet" href="./ui/credits.css" />
    <link rel="stylesheet" href="./ui/desktop-shortcuts.css" />
  </head>
  <body data-mode="studio" data-venue="burning-man" data-audio="idle">
    <header class="main-dock" aria-label="Sphere controls" inert>
      <div class="player-row">
        <button
          type="button"
          id="default-track"
          class="track-button"
          aria-label="Play Tree Voices"
          aria-pressed="false"
        >
          <img class="play-icon" src="icons/play.svg" width="20" height="20" alt="" />
          <img class="pause-icon" src="icons/pause.svg" width="20" height="20" alt="" />
        </button>
        <div id="tab-track" class="tab-track" hidden>
          <img src="icons/app-window.svg" width="23" height="23" alt="" />
        </div>
        <div class="track-copy">
          <span id="track-title" class="track-title">Tree Voices</span
          ><span id="track-state" role="status">Ready to play</span>
        </div>
      </div>
      <p id="track-status" role="status"></p>
      <button
        type="button"
        id="new-look"
        class="dice-button"
        aria-label="Vibe shift"
        title="Vibe shift"
      >
        <img src="icons/dices.svg" width="28" height="28" alt="" /><span>Vibe shift</span>
      </button>
      <button
        type="button"
        id="mobile-orbit"
        class="mobile-orbit"
        aria-label="Automatic orbit"
        aria-pressed="true"
      >
        <img src="icons/orbit.svg" width="24" height="24" alt="" /><span id="mobile-orbit-label"
          >Orbit on</span
        >
      </button>
      <span id="look-status" class="sr-only" role="status"></span>
      <div class="dock-footer">
        <div class="music-dock desktop-audio" data-audio-control>
          <details class="audio-options">
            <summary id="other-audio-label">
              Source <img src="icons/chevron-down.svg" width="12" height="12" alt="" />
            </summary>
            <div class="source-menu">
              <span class="source-menu-title">Audio source</span>
              <button type="button" id="use-tree-voices" aria-pressed="true">
                Tree Voices <span>Included track</span>
              </button>
              <button type="button" id="listen" class="connect-button">Connect a music tab</button>
              <button type="button" id="disconnect-audio" class="disconnect-button" disabled>
                Disconnect
              </button>
              <p id="audio-status" role="status" data-phase="idle"></p>
            </div>
          </details>
        </div>
        <div class="music-readings">
          <div class="input-meters" aria-label="Stereo audio levels">
            <label
              >L
              <meter
                id="audio-left"
                aria-label="Left audio input level"
                min="0"
                max="1"
                value="0"
              ></meter></label
            ><label
              >R
              <meter
                id="audio-right"
                aria-label="Right audio input level"
                min="0"
                max="1"
                value="0"
              ></meter
            ></label>
          </div>
          <div class="tempo-readout">
            <span id="beat-dot" aria-hidden="true"></span
            ><output id="tempo-status" aria-label="Estimated music tempo">— BPM</output>
          </div>
        </div>
      </div>
    </header>

    <main inert>
      <section class="stage" aria-label="Live sphere preview">
        <canvas
          id="view"
          tabindex="0"
          aria-label="Tiny Sphere. Drag to look in any direction inside, including straight up. Pinch or scroll to zoom. Pull back for a dolly zoom that smoothly levels the view. Space pauses the visuals."
        ></canvas>
        <div class="view-controls" role="group" aria-label="Camera view">
          <button type="button" id="orbit" aria-pressed="true">Slow orbit</button>
          <button type="button" id="reset-view">View reset</button>
        </div>
        <footer class="site-credits" aria-label="Credits">
          <span class="sphere-credit"
            ><span class="credit-title">Sonic Sphere</span> built by the
            <a
              href="https://www.sonic-sphere.com/spheres/ka9-sonic-sphere"
              target="_blank"
              rel="noopener noreferrer"
              >Sonic Sphere Collective<span class="sr-only"> (opens in a new tab)</span></a
            ></span
          >
          <span class="credit-divider" aria-hidden="true">·</span>
          <span class="music-credit"
            >Music by
            <a
              href="https://www.instagram.com/musicbyrolfekent/?hl=en"
              target="_blank"
              rel="noopener noreferrer"
              >Rolfe Kent<span class="sr-only"> (opens in a new tab)</span></a
            ></span
          >
          <span id="screenshot-hint" class="screenshot-hint" hidden>Press S for screenshot</span>
        </footer>
      </section>
    </main>
  <span id="screenshot-status" class="sr-only" role="status"></span>
    <div id="loading" class="loading-overlay" role="status" aria-live="polite" aria-busy="true">
      <div class="loading-content">
        <h1 id="loading-title">Tiny Sphere is loading</h1>
        <div class="loading-meter">
          <progress
            id="loading-progress"
            aria-label="Loading Tiny Sphere"
            max="100"
            value="0"
          ></progress
          ><output id="loading-percent" for="loading-progress">0%</output>
        </div>
        <p id="loading-detail">Preparing the sphere…</p>
        <button type="button" id="loading-retry" hidden>Try again</button>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
